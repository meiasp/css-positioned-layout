<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <!-- แถบหัวด้านบน -->
  <header class="header">Techup Chatroom</header>

  <!-- พื้นที่แชท: flex แบ่งซ้าย-ขวา -->
  <main class="chat">

    <!-- ===== คอลัมน์ซ้าย (ต้องเขียนก่อน เพราะ flex เรียงตามลำดับใน HTML) ===== -->
    <div class="column column-left">
      <div class="message message-dark">🍩</div>
      <div class="message message-dark">🍩</div>
    </div>

    <!-- ===== คอลัมน์ขวา ===== -->
    <div class="column column-right">

      <!-- badge เขียวเล็ก ๆ ที่มุมขวาบน -->
      <div class="message message-green">
        สวัสดีจ้า
        <span class="badge badge-green"></span>
      </div>

      <!-- ปุ่ม x ที่มุมขวาบน -->
      <div class="message message-light">
        Coding สนุกจังเลย
        <span class="badge badge-close"><i class="fa-solid fa-xmark"></i></span>
      </div>

      <div class="message message-green">🍩 🍩</div>

    </div>

  </main>
</body>

</html>
